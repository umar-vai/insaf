name: Inspect temporary concept image source
on:
  push:
    branches: [feature/hero-landscape-actual-2026-11]
    paths: [.github/workflows/check-hero-source.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check image delivery variants
        env:
          ASSET_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F2ed06d8e-155c-4ca7-94a5-9de0b002337f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAN8eNTQmWN9b_nEYdffJQTqgsYri404ywXtpH9pR73UD&exp=1794354329&osig=AAAAAAAAAAAAAAAAAAAAALyFbbZUHj2RpsHPXlZ94sCYVhoRux8Kqpuw8jGxj6FM&signer=media-rpc&token=AAIAAU0AJDJlZDA2ZDhlLTE1NWMtNGNhNy05NGE1LTlkZTBiMDAyMzM3ZgAAAAABocfaNagrrVvOIOIF5g1E9a3TXlFhm8y4hzCIBZ2pqqegyBXPlA&x-canva-quality=thumbnail"
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os,urllib.parse,urllib.request
          url=os.environ['ASSET_URL']
          for name,u in [('thumbnail',url),('original_width',url.replace('height:112','height:941').replace('width:200','width:1672')),('medium_width',url.replace('height:112','height:500').replace('width:200','width:900'))]:
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data=r.read()
                      print(name, r.status, r.headers.get('content-type'),len(data),data[:12].hex())
              except Exception as e: print(name,'ERROR',type(e).__name__,str(e)[:120])
          PY
